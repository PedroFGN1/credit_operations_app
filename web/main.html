<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Operações de Crédito v2</title>
    
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="javascript/tailwindcss.js"></script>
    <script src="javascript/flowbite.min.js"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-100">
    
    <nav class="bg-white border-gray-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="#" class="flex items-center space-x-3">
                <img src="images/logoC_color.png" class="h-8" alt="Logo" />
                <span class="self-center text-2xl font-semibold whitespace-nowrap">Simulador v2</span>
            </a>
            <div class="flex md:order-2">
                <button id="btn-atualizar" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 text-center">
                    Atualizar Dados Siconfi
                </button>
            </div>
        </div>
    </nav>
    
    <div class="flex-grow container px-6 py-6 mx-auto my-2">

        <section class="bg-white mt-8 rounded-xl border shadow-sm" id="secao-simulacao">
            <div class="container px-6 py-6 mx-auto">
                
                <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                    <h2 class="text-2xl font-bold mb-4 text-gray-800">Simulação de Operação de Crédito</h2>
                    <form id="form-simulacao" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="ano" class="block text-sm font-medium text-gray-700 mb-2">Ano de Referência:</label>
                                <select id="ano" name="ano" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    </select>
                            </div>
                            <div>
                                <label for="valor-requisitado" class="block text-sm font-medium text-gray-700 mb-2">Valor Requisitado (R$):</label>
                                <input type="number" id="valor-requisitado" name="valor-requisitado" step="0.01" min="0" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                       placeholder="Digite o valor (opcional)">
                            </div>
                        </div>
                        <div class="flex justify-center pt-4">
                            <button type="submit" class="px-8 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                Simular Operação
                            </button>
                        </div>
                    </form>
                </div>

                <div id="tabela-resultados-container" class="bg-white p-6 rounded-lg shadow-md mb-6" style="display: none;">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">Resultados da Análise</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full bg-white">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Regra</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-resultados" class="bg-white divide-y divide-gray-200">
                                </tbody>
                        </table>
                    </div>
                </div>
                </div>
        </section>

        <section class="bg-white mt-8 rounded-xl border shadow-sm" id="secao-dados">
           </section>

        <section class="bg-white mt-8 rounded-xl border shadow-sm" id="secao-upload">
            </section>
        
    </div>
    
    <div id="modal-feedback" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-10 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center pb-3 border-b">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold text-gray-900">Nome da Regra</h3>
                    <p id="modal-status" class="font-semibold">Status</p>
                </div>
                <button id="btn-fechar-modal" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            
            <div class="mt-4 max-h-[70vh] overflow-y-auto p-1">
                <dl class="space-y-4">
                    <div>
                        <dt class="font-semibold text-gray-800">Descrição</dt>
                        <dd id="modal-descricao" class="text-sm text-gray-600 ml-2">...</dd>
                    </div>
                    <div>
                        <dt class="font-semibold text-gray-800">Próximo Passo</dt>
                        <dd id="modal-proximo-passo" class="text-sm text-gray-600 ml-2">...</dd>
                    </div>
                    <div>
                        <dt class="font-semibold text-gray-800">Base Normativa</dt>
                        <dd id="modal-base-normativa" class="text-sm text-gray-600 ml-2">...</dd>
                    </div>
                    <div>
                        <dt class="font-semibold text-gray-800">Objetivo</dt>
                        <dd id="modal-objetivo" class="text-sm text-gray-600 ml-2">...</dd>
                    </div>
                    <div id="modal-dados-calculados-container">
                        <dt class="font-semibold text-gray-800">Dados Calculados</dt>
                        <dd id="modal-dados-calculados" class="text-sm text-gray-600 ml-2"></dd>
                    </div>
                </dl>
            </div>
            
            <div class="flex justify-end pt-3 mt-4 border-t">
                <button id="btn-fechar-modal-2" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md shadow-sm hover:bg-gray-600">
                    Fechar
                </button>
            </div>
        </div>
    </div>
    <footer class="bg-white border-t border-gray-200 mt-auto">
        </footer>

    <script src="js/eel-main.js"></script>
</body>
</html>
